name: source-checks

on:
  push:
  pull_request:

jobs:
  node-source-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check app.js
          node --check server.cjs
      - name: Build Windows launchers
        shell: powershell
        run: .\launcher\build.ps1
      - name: Isolated server self-test
        shell: powershell
        run: |
          $env:CONTENTOPS_CARD_RENDERER = (Resolve-Path .\launcher\bin\CardRenderer.exe)
          node server.cjs --self-test
