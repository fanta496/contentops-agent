name: source-checks

on:
  push:
  pull_request:

jobs:
  node-source-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check app.js
          node --check server.cjs
      - name: Build Windows launchers
        shell: powershell
        run: .\launcher\build.ps1
      - name: Full check (security + API snapshot + self-test)
        shell: powershell
        run: node tests/run-all.cjs
